[project]
name = "apiverve-markdownlinkextractor"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Markdown Link Extractor parses markdown documents and extracts all links including inline, reference, autolinks, and image URLs."
keywords = ["markdown links", "link parser", "url extractor", "markdown analyzer", "link finder"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/markdownlinkextractor?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/markdownlinkextractor?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/markdownlinkextractor-api"
Twitter = "https://twitter.com/apivervehq"
